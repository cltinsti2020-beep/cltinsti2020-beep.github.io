<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการแผนการปฏิบัติงานโครงการฝึกอบรม</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;height:100%;background:#eef4fb;overflow:hidden}
  iframe{display:block;width:100vw;height:100vh;border:0}
</style>
</head>
<body>
<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbyMRjbETvmFqVfMxySoXh-V1zCdG8J3E6qgGTZujiV_WA6w2XuXE3Im6aW1xeVFq0vIXg/exec?v=edit"
        title="จัดการแผน" allow="clipboard-write; fullscreen"></iframe>
<script>
  (function(){
    var f = document.getElementById('app'), u = f.getAttribute('data-src');
    var q = location.search.slice(1);
    if (q) u += (u.indexOf('?') >= 0 ? '&' : '?') + q;
    f.src = u;
  })();
</script>
</body>
</html>
