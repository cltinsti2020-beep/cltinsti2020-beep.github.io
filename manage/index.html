<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการแผนการปฏิบัติงานโครงการฝึกอบรม</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;height:100%;background:#eef4fb;overflow:hidden}
  iframe{display:block;width:100vw;height:100vh;border:0}
  .fb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,"Sarabun",sans-serif;color:#44586d;font-size:15px;z-index:-1}
</style>
</head>
<body>
<div class="fb">กำลังเปิดระบบ…</div>

<!-- ===== เปลี่ยนเฉพาะ data-src ด้านล่างนี้ ถ้า deploy เว็บแอปใหม่ ===== -->
<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbzeoSfWa3Gc1o5hLRUi7ysM14cu5v_ivOzFncKhIzrq5uiOdp5BdX2rKrINGH_GG6wKyQ/exec?v=edit"
        title="จัดการแผนการปฏิบัติงานโครงการฝึกอบรม" allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* ส่งค่าที่ต่อท้ายลิงก์ เช่น ?fy=2570 เข้าไปในแอปด้วย
     และเก็บบัตรผ่าน (รหัสผ่านที่ใส่แล้ว) ไว้ที่หน้านี้ ซึ่งอยู่ที่เดียวกันทุกครั้ง
     ใส่รหัสครั้งเดียว ไปทุกระบบและกลับมาหน้าแผนได้โดยไม่ถามซ้ำ */
  (function(){
    var KEY = 'cl_tk';
    var f = document.getElementById('app'), u = f.getAttribute('data-src');
    var q = location.search.slice(1);
    var saved = ''; try{ saved = localStorage.getItem(KEY) || ''; }catch(e){}
    /* เปิดลิงก์ manage ตรง ๆ โดยยังไม่เคยใส่รหัส → พาไปหน้าแรก (ดูอย่างเดียว) ก่อน
       จะถามรหัสก็ต่อเมื่อกดปุ่ม "จัดการแผน" (ลิงก์ของปุ่มมี go=1) */
    if (!saved && !/(^|&)(go|tk)=/.test(q)){
      var fy = (q.match(/(?:^|&)fy=(\d+)/) || [])[1];
      location.replace(location.pathname.replace(/manage\/?(index\.html)?$/, '') + (fy ? '?fy=' + fy : ''));
      return;
    }
    if (saved && !/(^|&)tk=/.test(q)) q += (q ? '&' : '') + 'tk=' + encodeURIComponent(saved);
    window.addEventListener('message', function(e){
      var h = ''; try{ h = new URL(e.origin).hostname; }catch(x){}
      if (!/(^|\.)(googleusercontent|google)\.com$/.test(h)) return;
      var d = e.data;
      if (!d || typeof d !== 'object' || !('cltk' in d)) return;
      var v = String(d.cltk || '').replace(/[^A-Za-z0-9]/g, '');
      try{ v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); }catch(x){}
    });
    if (q) u += (u.indexOf('?') >= 0 ? '&' : '?') + q;
    f.src = u;
  })();
</script>
</body>
</html>
