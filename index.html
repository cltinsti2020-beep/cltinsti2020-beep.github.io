<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนการปฏิบัติงานโครงการฝึกอบรม</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eef4fb;overflow:hidden}
  iframe{display:block;width:100vw;height:100vh;border:0}
  .fb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,"Sarabun",sans-serif;color:#44586d;font-size:15px;z-index:-1}
</style>
</head>
<body>
<div class="fb">กำลังเปิดระบบ…</div>

<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbzeoSfWa3Gc1o5hLRUi7ysM14cu5v_ivOzFncKhIzrq5uiOdp5BdX2rKrINGH_GG6wKyQ/exec"
        title="แผนการปฏิบัติงานโครงการฝึกอบรม" allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  (function(){
    var f = document.getElementById('app'), u = f.getAttribute('data-src');
    var q = location.search.slice(1);
    if (q) u += (u.indexOf('?') >= 0 ? '&' : '?') + q;
    f.src = u;
  })();
</script>
</body>
</html>
