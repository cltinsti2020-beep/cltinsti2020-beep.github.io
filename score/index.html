<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>ตรวจสอบผลคะแนน</title>
<link rel="icon" href="data:,">
<!--
  หน้าครอบของหน้าตรวจคะแนน  (ใช้แบบเดียวกับหน้าครอบ /exam/ ที่มีอยู่แล้ว)
  วิธีติดตั้ง
    1) ในที่เก็บของ GitHub Pages สร้างโฟลเดอร์ชื่อ  score
    2) ใส่ไฟล์นี้ลงไป ตั้งชื่อว่า  index.html   (ได้ที่อยู่ .../score/)
    3) ใน Code.gs เปลี่ยน  SCORE_SITE : false  เป็น  true  แล้วดีพลอยใหม่
  ลิงก์ที่ได้ = https://cltinsti2020-beep.github.io/score/?examId=รหัสข้อสอบ  (ไม่มีแถบของ Google)

  EXEC ด้านล่างคือลิงก์ /exec ของเว็บแอปตัวเดียวกับที่ embed.html ใช้
  ถ้าหน้าครอบ /exam/ ของคุณชี้ลิงก์ /exec อื่น ให้ใช้ลิงก์เดียวกับหน้านั้น
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#f3f7f4;overflow:hidden}
  iframe{display:block;width:100%;height:100%;border:0}
  @media (prefers-color-scheme: dark){ html,body{background:#0b1511} }
</style>
</head>
<body>
<iframe id="f" title="ตรวจสอบผลคะแนน" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbyMRjbETvmFqVfMxySoXh-V1zCdG8J3E6qgGTZujiV_WA6w2XuXE3Im6aW1xeVFq0vIXg/exec';
  var id = '';
  try { id = (new URLSearchParams(location.search).get('examId') || ''); } catch (e) {}
  /* ส่งต่อเฉพาะรหัสข้อสอบ (ตัวอักษร ตัวเลข และขีด) ไม่ส่งพารามิเตอร์อื่นของลิงก์ต่อเข้าไป */
  id = id.replace(/[^A-Za-z0-9\-]/g, '');
  document.getElementById('f').src = EXEC + '?page=score&examId=' + encodeURIComponent(id);
</script>
</body>
</html>
